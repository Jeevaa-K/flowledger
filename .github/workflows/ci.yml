name: CI

on:
  push:
    branches: [main, master, '**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Backend Tests & Security Regressions
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: flowledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Jest test suite (Unit & Real Postgres Integration)
        working-directory: backend
        env:
          CI: 'true'
          NODE_ENV: test
          PORT: 3001
          JWT_SECRET: test-secret-test-secret-test-secret-1234-super-secure
          DATABASE_URL: postgresql://postgres:password@localhost:5432/flowledger_test
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/flowledger_test
          ALLOWED_ORIGINS: https://app.example.com
        run: npm test
